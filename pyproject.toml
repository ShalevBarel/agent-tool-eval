[project]
name = "agent-eval"
version = "0.1.0"
description = "An evaluation harness for tool-using LLM agents"
readme = "README.md"
authors = [
    { name = "ShalevBarel", email = "shalevbarel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
agent-eval = "agent_eval:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
