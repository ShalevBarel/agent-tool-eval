[project]
name = "agent-eval"
version = "0.1.0"
description = "An evaluation harness for tool-using LLM agents"
readme = "README.md"
authors = [
    { name = "ShalevBarel", email = "shalevbarel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
agent-eval = "agent_eval:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "networkx>=3.7",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
